<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3C门店经营台账</title>
<meta name="theme-color" content="#2563EB">
<style>
:root{
  --primary:#2563EB;--primary-d:#1D4ED8;--primary-l:#EFF6FF;
  --bg:#F5F7FA;--card:#fff;--text:#0F172A;--sub:#64748B;--faint:#94A3B8;--border:#E2E8F0;
  --danger:#DC2626;--danger-bg:#FEF2F2;--success:#16A34A;--success-bg:#F0FDF4;
  --warn:#D97706;--warn-bg:#FFFBEB;--purple:#7C3AED;--cyan:#0891B2;--soft:#F1F5F9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
body{padding-bottom:76px}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
a{color:inherit;text-decoration:none}
.ic{font-family:"Font Awesome 6 Free";font-weight:900}

/* 顶栏 */
.hdr{background:linear-gradient(135deg,#2563EB,#1E40AF);color:#fff;padding:18px 18px 20px;
 border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;
 background:rgba(255,255,255:.08);right:-70px;top:-100px}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hdr .t1{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.hdr .t2{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:.3px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t3{font-size:12px;color:rgba(255,255,255,.8);margin-top:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);border:0;
 color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);flex-shrink:0;
 border:0;color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:12px;white-space:nowrap}
@media(max-width:400px){
 .hdr{padding:16px 14px 18px}
 .hdr .t2{font-size:18px}
 .hdr .t3{font-size:11px}
 .pill{font-size:11px;padding:6px 9px;gap:4px}
 .iconbtn{width:34px;height:34px;font-size:14px}
}
.pill.solid{background:#fff;color:var(--primary)}

/* 布局 */
.wrap{padding:14px 14px 4px}
.sec{margin-top:14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card+.card{margin-top:12px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:12px}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--primary);font-weight:700}
.hint{font-size:11px;color:var(--faint);line-height:1.6}
.kpis{display:flex;flex-wrap:wrap;gap:16px 20px}
.kpi{min-width:calc(50% - 10px);flex:1}
.kpi .k{font-size:11px;color:var(--sub)}
.kpi .v{font-size:17px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.big .v{font-size:22px;color:var(--primary)}
.divider{height:1px;background:var(--border);margin:12px 0}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;
 background:var(--soft);color:var(--sub)}
.badge.blue{background:#EFF6FF;color:#2563EB}.badge.green{background:var(--success-bg);color:var(--success)}
.badge.red{background:var(--danger-bg);color:var(--danger)}.badge.amber{background:var(--warn-bg);color:var(--warn)}
.badge.purple{background:#F5F3FF;color:var(--purple)}
.delta{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;margin-left:8px}

/* 列表 */
.item{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;
 box-shadow:0 1px 2px rgba(15,23,42,.04)}
.item .lr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item .name{font-size:15px;font-weight:800;flex:1;min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
.item .money{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.grid2 .k{font-size:11px;color:var(--faint)}
.grid2 .v{font-size:13px;font-weight:700;margin-top:2px}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:44px 0}
.empty i{display:block;font-size:30px;margin-bottom:10px;color:#CBD5E1}

/* 搜索/分段 */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:11px 13px;
 border:1px solid var(--border);margin-bottom:12px}
.search input{border:0;outline:0;flex:1;font-size:14px;background:transparent;color:var(--text)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border);margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;font-size:12px;font-weight:700;color:var(--sub);
 padding:8px 4px;border-radius:9px}
.seg button.on{background:var(--primary);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 12px;
 font-size:12px;color:var(--sub);font-weight:600}
.chip.on{background:var(--primary-l);border-color:#BFDBFE;color:var(--primary)}
.chip.amber{background:var(--warn-bg);border-color:#FDE68A;color:#92400E}
.foldbar{width:100%;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
 border-radius:12px;padding:9px 12px;font-size:12px;color:var(--sub);font-weight:700;text-align:left}
.foldbar .fb-l{color:var(--text)}
.foldbar .fb-h{color:var(--faint);font-weight:600;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldwrap{margin-top:10px}

/* 按钮 */
.btn{border:0;border-radius:12px;font-size:14px;font-weight:700;padding:11px 16px;background:var(--primary);color:#fff}
.btn.ghost{background:var(--soft);color:var(--sub)}
.btn.line{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.sm{font-size:12px;padding:7px 11px;border-radius:9px}
.btn.block{width:100%}
.btn:active{opacity:.8}
.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:88px;z-index:40;
 width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:0;font-size:20px;
 box-shadow:0 8px 20px rgba(37,99,235,.35)}
@media(max-width:540px){.fab{right:16px}}

/* 底部导航 */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;
 border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;
 padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
#tabbar button{flex:1;border:0;background:transparent;color:var(--faint);font-size:11px;font-weight:700;
 display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0}
#tabbar button i{font-size:19px}
#tabbar button.on{color:var(--primary)}

/* 抽屉 */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:60;display:none}
#mask.on{display:block}
#drawer{position:fixed;top:0;bottom:0;right:0;width:78%;max-width:340px;background:#fff;z-index:61;
 transform:translateX(100%);transition:transform .22s ease;padding:20px 16px;overflow-y:auto;
 box-shadow:-8px 0 24px rgba(15,23,42,.12)}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#drawer .dh b{font-size:17px}
#drawer .grp{font-size:11px;color:var(--faint);font-weight:700;margin:16px 0 8px;letter-spacing:.5px}
#drawer a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-size:14px;font-weight:600}
#drawer a i{width:20px;text-align:center;color:var(--primary)}
#drawer a:active{background:var(--soft)}

/* 表单弹层 */
#sheetmask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none}
#sheetmask.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:520px;margin:0 auto;background:#fff;
 border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
 transform:translateY(110%);transition:transform .24s ease}
#sheet.on{transform:none}
#sheet .sh{display:flex;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
#sheet .sh b{flex:1;font-size:17px;font-weight:800}
#sheet .sb{overflow-y:auto;padding:14px 18px 8px}
#sheet .sf{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.field label .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:11px;
 padding:11px 12px;font-size:14px;background:#fff;color:var(--text);outline:0;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:70px;resize:vertical}
.field .fh{font-size:11px;color:var(--faint);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 聊天 */
.msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.ai{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
#chatbox{padding:14px}
/* 底部固定输入 */
.chatbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;
 border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:8px;z-index:50}
.chatbar input{flex:1;border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14px;outline:0}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.9);color:#fff;
 padding:12px 18px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.warnbox{background:var(--warn-bg);border:1px solid #FDE68A;color:#92400E;border-radius:12px;
 padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--success-bg);border:1px solid #BBF7D0;color:#166534;border-radius:12px;
 padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:12px}
/* ============ 复刻版样式（对齐原 App） ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
body{padding-bottom:70px}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
.lr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{font-size:12px;color:var(--sub);line-height:1.5}
.hint{font-size:11px;color:var(--faint);line-height:1.65}
.divider{height:1px;background:var(--border);margin:12px 0}
.wrap{padding:14px 14px 4px}
.pad{padding:0 14px}

/* 看板头部（蓝） */
.hero{background:linear-gradient(135deg,#2563EB,#1E40AF);border-radius:0 0 22px 22px;padding:20px 18px 22px;position:relative;overflow:hidden;color:#fff}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255:.08);right:-60px;top:-90px}
.hbar{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:2;gap:10px}
.hl1{font-size:20px;font-weight:900;letter-spacing:.4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl2{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin-top:7px}
.hl3{font-size:12px;color:rgba(255,255,255,.78);margin-top:6px}
.roundbtn{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* 二级页蓝色头 */
.bhead{background:linear-gradient(135deg,#2563EB,#1E40AF);border-radius:0 0 22px 22px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.btitle{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bact{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bsub{font-size:12px;color:rgba(255,255,255,.8);margin-top:6px;position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);flex-shrink:0;border:0;color:#fff;font-size:12px;font-weight:700;padding:7px 11px;border-radius:11px;white-space:nowrap}
.pill.danger{background:#fff;color:var(--danger)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.ghost{width:34px;height:34px}
.iconbtn.sq{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--primary);font-size:12px}
.iconbtn.sq.red{background:var(--danger-bg);color:var(--danger)}

/* 头部内搜索条 */
.bsearch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin-top:12px;position:relative;z-index:2}
.bsearch i{color:var(--faint);font-size:13px}
.bsearch input{flex:1;border:0;outline:0;font-size:13px;color:var(--text);background:transparent;min-width:0}
.sortbtn{border:0;background:transparent;color:var(--sub);font-size:12px;font-weight:700;flex-shrink:0;padding:0 0 0 8px}
.bluechips{padding:0 0 2px}
.bluechips .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff}
.bluechips .chip.onblue.on{background:#fff;color:var(--primary);border-color:#fff;font-weight:800}

/* 卡片 */
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);margin-top:12px}
.wrap>.card:first-child{margin-top:0}
.sec-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:12px}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--primary);font-weight:700}
.kpis{display:flex;flex-wrap:wrap;gap:14px 16px}
.kpi{min-width:calc(50% - 8px);flex:1}
.kpi .k{font-size:11px;color:var(--sub)}
.kpi .v{font-size:16px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.profitrow{display:flex;align-items:center;gap:8px}
.profitrow .k{font-size:12px;color:var(--sub);margin-right:auto}
.profitrow b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--sub);white-space:nowrap}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.blue{background:var(--primary-l);color:var(--primary)}
.tag.amber{background:var(--warn-bg);color:var(--warn)}

/* 经营速览翻页 */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pslide{min-width:100%;scroll-snap-align:start;padding-right:2px}
.prow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.prow b{font-size:13px;color:var(--text)}
.prow span{font-size:12px;color:var(--primary);font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:#DBEAFE;display:block}
.dots i.on{background:var(--primary);width:14px}

/* 快捷入口 */
.quickfull{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:14px;font-weight:800;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickcard{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;font-size:13px;font-weight:800;color:var(--text)}
.qi{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px}

/* 行 / 人员 */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:16px;background:var(--primary-l);color:var(--primary);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grow{flex:1;min-width:0}

/* 列表 */
.item{background:#fff;border-radius:16px;padding:14px;margin:10px 14px 0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.item .name{font-size:15px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{margin-top:5px}
.item .money{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.lowcard{border:1px solid #FECACA;background:#FFFBFB}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:44px 14px}
.empty i{display:block;font-size:28px;margin-bottom:10px;color:#CBD5E1}
.delbtn{border:0;background:transparent;color:#CBD5E1;font-size:13px;padding:2px 2px;flex-shrink:0}
.delbtn:active{color:var(--danger)}

/* 备件三格 */
.ministats{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;margin-top:12px;padding:10px;background:#F8FAFC;border-radius:12px}
.ms .k{font-size:10px;color:var(--faint)}
.ms .v{font-size:15px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.ms .v span{font-size:11px;font-weight:600;color:var(--faint)}
.ms.msred .v{color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;font-size:14px;font-weight:700;padding:11px 16px;background:var(--primary);color:#fff}
.btn.ghost{background:var(--soft);color:var(--sub)}
.btn.line{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.sm{font-size:12px;padding:7px 11px;border-radius:9px}
.btn.xs{font-size:11px;padding:5px 9px;border-radius:8px;background:var(--primary)}
.btn.block{width:100%;text-align:center}
.btn.blockx{flex:1;font-size:12px;padding:9px 6px;border-radius:10px}
.btn.blockx.success{background:var(--success);color:#fff}
.btn.blockx.danger{background:var(--danger-bg);color:var(--danger)}
.btn.flex{flex:1}
.btn:active{opacity:.85}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--sub);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--primary-l);border-color:#BFDBFE;color:var(--primary)}
.chip .cnt{font-size:10px;color:var(--faint);font-weight:700}
.chip.on .cnt{color:var(--primary)}
.segline{display:flex;gap:8px;margin-top:12px;position:relative;z-index:2}
.segline button{flex:1;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:800;padding:9px;border-radius:11px}
.segline button.on{background:#fff;color:var(--primary);border-color:#fff}
.seg2{display:flex;gap:8px;margin-bottom:14px}

/* ================= 计算 ================= */
const partsCost = o => (o.parts || []).reduce((s, p) => s + num(p.qty) * num(p.unit_cost), 0);
const oCost = o => num(o.cost) + partsCost(o);
const oProfit = o => num(o.income) - oCost(o);
const orderList = ym => DB.orders.filter(o => (o.order_date || '').slice(0, 7) === ym);
const mStats = ym => {
  const l = orderList(ym);
  const income = l.reduce((a, o) => a + num(o.income), 0);
  const cost = l.reduce((a, o) => a + oCost(o), 0);
  return { l, income, cost, profit: income - cost, n: l.length };
};
const flowStats = ym => {
  const l = DB.flows.filter(f => (f.date || '').slice(0, 7) === ym);
  const inc = l.filter(f => f.type === '收入').reduce((a, f) => a + num(f.amount), 0);
  const out = l.filter(f => f.type === '支出').reduce((a, f) => a + num(f.amount), 0);
  return { inc, out, net: inc - out, l };
};
const fixedTotal = () => { const c = (DB && DB.costModel) ? DB.costModel : {}; return num(c.rent) + num(c.utility) + num(c.labor) + num(c.yearly) / 12; };
const inStock = () => DB.devices.filter(d => d.status === '在库');
const repairDev = () => DB.devices.filter(d => d.status === '待修' || d.status === '转维修' || d.repair_status === '是');
const stockSum = () => {
  const s = inStock();
  const buy = s.reduce((a, d) => a + num(d.buy_price), 0), listed = s.reduce((a, d) => a + num(d.listed_price), 0);
  const rep = repairDev().reduce((a, d) => a + num(d.buy_price), 0);
  const parts = DB.parts.reduce((a, p) => a + num(p.stock_qty) * num(p.buy_price), 0);
  return { count: s.length, buy, listed, exp: listed - buy, rep, repCount: repairDev().length, parts, total: buy + rep + parts };
};
const partLow = p => !(p.remark || '').includes('未进货') && (num(p.stock_qty) <= 0 || num(p.stock_qty) <= num(p.safe_stock));
const lowParts = () => DB.parts.filter(partLow);
const activePawns = () => DB.pawns.filter(p => p.status === '在押');
const debtTotal = () => DB.pawns.filter(p => !p.settled_date).reduce((a, p) => a + num(p.outQty) * num(p.purchase_price), 0);
const pendingTasks = () => DB.tasks.filter(t => t.status !== 'done');
const customers = () => {
  const m = new Map();
  DB.orders.forEach(o => {
    const nm = String(o.customer || o.customer_source || o.customer_phone || '未登记').trim();
    const k = nm;
    if (!m.has(k)) m.set(k, { key: k, name: nm, phone: o.customer_phone || '', count: 0, total: 0, last: '', first: '', src: '' });
    const c = m.get(k); c.count++; c.total += num(o.income);
    if ((o.order_date || '') > c.last) c.last = o.order_date || '';
    if (!c.first || (o.order_date || '') < c.first) c.first = o.order_date || '';
    if (!c.src && o.customer_source) c.src = o.customer_source;
  });
  const tags = DB.customerTags || {};
  const now = new Date(today());
  return Array.from(m.values()).map(c => {
    const d = c.last ? Math.floor((now - new Date(c.last)) / 86400000) : null;
    return Object.assign(c, { priv: !!tags[c.key], silent: d != null && d >= 90, repeat: c.count >= 2, gapDays: d });
  }).sort((a, b) => b.total - a.total);
};

const SKEY = 'ql3c_session_v2';
const STTL = 30 * 86400000; // 登录有效期 30 天，期间每次打开自动续期
let SESSION = null, LOGIN_MODE = 'login';
const OWNER_ONLY = ['/index', '/cost', '/cash', '/slow', '/store-expense', '/accounts', '/audit-logs', '/settings', '/engineer-stats', '/platform', '/aftersale', '/hr', '/supply', '/compete', '/sop'];
const isEng = () => !!SESSION && SESSION.role === 'engineer';
const isOwner = () => !!SESSION && SESSION.role === 'owner';
function loadSession() {
  try {
    const s = localStorage.getItem(SKEY); if (!s) return null;
    const o = JSON.parse(s); if (!o || !o.name) return null;
    if (o.ts && Date.now() - o.ts > STTL) { localStorage.removeItem(SKEY); return null; }
    o.ts = Date.now(); localStorage.setItem(SKEY, JSON.stringify(o)); // 用过就顺延 30 天
    return { name: o.name, username: o.username, role: o.role };
  } catch (e) { return null; }
}
function saveSession() {
  if (!SESSION) return;
  try { localStorage.setItem(SKEY, JSON.stringify({ name: SESSION.name, username: SESSION.username, role: SESSION.role, ts: Date.now() })); } catch (e) {}
}
function bootAuth() { // 启动/切页时恢复登录态，账号被停用或删除就退回登录页
  SESSION = loadSession();
  if (!SESSION) return;
  const u = ensureUsers().find(x => x.name === SESSION.name);
  if (!u || !u.active) { SESSION = null; try { localStorage.removeItem(SKEY); } catch (e) {} return; }
  SESSION.role = u.role; saveSession();
}
function ensureUsers() {
  DB.users = DB.users || [];
  (DB.engineers || []).forEach(e => {
    if (!DB.users.some(u => u.name === e.name)) DB.users.push({ id: uid('u'), name: e.name, username: e.name, role: e.role === 'owner' ? 'owner' : 'engineer', phone: e.phone || '', pwd: '', must: true, active: true });

}
function hashPwd(s) {
  let h1 = 0x811c9dc5, h2 = 0x9747b28c; const str = 'ql3c|' + String(s);
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2654435761) >>> 0; }
  return ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
}

/* ================= 云同步（GitHub 私有 Gist 当后端，多机共用一份数据） ================= */
const GKEY = 'ql3c_gh_v1';
let GH = { cfg: null, rev: 0, at: '', busy: false, off: false, force: false, warned: false };
function ghLoad() { try { const o = JSON.parse(localStorage.getItem(GKEY) || '{}'); GH = Object.assign({ cfg: null, rev: 0, at: '', busy: false, off: false, force: false, warned: false }, o); } catch (e) { GH.cfg = null; } }
function ghStore() { try { localStorage.setItem(GKEY, JSON.stringify({ cfg: GH.cfg, rev: GH.rev, at: GH.at })); } catch (e) {} }
function ghOn() { return !!(GH.cfg && GH.cfg.token); }
async function ghApi(method, path, body) {
  const r = await fetch('https://api.github.com' + path, {
    method,
    headers: {
      Authorization: 'Bearer ' + GH.cfg.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const m = (j && j.message) || ('HTTP ' + r.status);
    if (r.status === 401) throw new Error('Token 无效或已过期，重新生成一个（只勾 gist）');
    if (r.status === 404) throw new Error('云库不存在：Gist 被删了或 ID 填错');
    if (r.status === 403) throw new Error('Token 权限不够：只勾 gist 重新生成');
    throw new Error(m);
  }
  return j;
}
async function ghRead() {
  const g = await ghApi('GET', '/gists/' + GH.cfg.gist_id + '?t=' + Date.now());
  const f = g && g.files && g.files['ledger.json'];
  if (!f) throw new Error('云库里没有 ledger.json');
  let obj = null;
  try { obj = JSON.parse(f.content); } catch (e) { throw new Error('云端数据损坏'); }
  return { meta: obj, gist: g };
}
async function ghPush(silent) {
  if (!ghOn()) { if (!silent) toast('先在「云同步」里填 Token'); return; }
  if (GH.busy) return; GH.busy = true;
  try {
    let remoteRev = 0, remoteWho = '', remoteTs = 0;
    if (GH.cfg.gist_id) {
      try { const r = await ghRead(); remoteRev = r.meta.rev || 0; remoteWho = r.meta.who || ''; remoteTs = r.meta.ts || 0; } catch (e) {}
    }
    if (remoteRev > (GH.rev || 0) && !GH.force) {
      GH.busy = false; GH.force = false;
      if (silent) { if (!GH.warned) { GH.warned = true; toast('云端有更新（' + (remoteWho || '他人') + '），先到「同步与备份」拉取'); } }
      else toast('云端有更新（' + (remoteWho || '他人') + ' ' + new Date(remoteTs || Date.now()).toLocaleString('zh-CN') + '），先点「拉取云端」');
      return;
    }
    const rev = Math.max(GH.rev || 0, remoteRev) + 1, ts = Date.now(), who = SESSION ? SESSION.name : '本机';
    const content = JSON.stringify({ rev, ts, who, data: DB });
    if (!GH.cfg.gist_id) {
      const g = await ghApi('POST', '/gists', { description: '东芯数码-3C台账云库', public: false, files: { 'ledger.json': { content } } });
      GH.cfg.gist_id = g.id; ghStore();
    } else {
      await ghApi('PATCH', '/gists/' + GH.cfg.gist_id, { files: { 'ledger.json': { content } } });
    }
    GH.rev = rev; GH.at = new Date(ts).toLocaleString('zh-CN'); GH.force = false; ghStore();
    if (!silent) toast('已上传到云库（v' + rev + '，' + who + '）');
  } catch (e) { if (!silent) toast('上传失败：' + (e.message || e)); console.warn(e); }
  GH.busy = false;
}
async function ghPull() {
  if (!ghOn()) { toast('先在「云同步」里填 Token'); return; }
  if (!GH.cfg.gist_id) { toast('还没有云库，先点「上传本机」建一个'); return; }
  if (GH.busy) return; GH.busy = true;
  try {
    const r = await ghRead();
    if (!r.meta || !r.meta.data) throw new Error('云端还没有数据');
    DB = r.meta.data; GH.rev = r.meta.rev || 0; GH.at = new Date(r.meta.ts || Date.now()).toLocaleString('zh-CN'); ghStore();
    GH.off = true; persist(); GH.off = false; ensureUsers(); bootAuth(); render();
    toast('已拉取云端 v' + GH.rev + '（' + (r.meta.who || '') + ' ' + GH.at + '）');
  } catch (e) { toast('拉取失败：' + (e.message || e)); console.warn(e); }
  GH.busy = false;
}
let _ghTimer = 0;
function ghSchedule() { if (!ghOn() || GH.busy) return; clearTimeout(_ghTimer); _ghTimer = setTimeout(() => { if (!GH.busy && !GH.off) ghPush(true); }, 4000); }

}

/* ================= 同步码（不联网也能把两台手机对成同一份账） ================= */
async function packCode() {
  const json = JSON.stringify(DB);
  try {
    if (typeof CompressionStream === 'function') {
      const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
      return 'DX3C1:' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+/g, '');
    }
  } catch (e) {}
  return 'DX3C0:' + btoa(unescape(encodeURIComponent(json)));
}
async function unpackCode(code) {
  code = (code || '').trim().replace(/\s+/g, '');
  if (code.indexOf('DX3C1:') === 0) {
    const b = code.slice(6).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
    const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const st = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(st).text());
  }
  if (code.indexOf('DX3C0:') === 0) return JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  return JSON.parse(code);
}
async function openSyncOut() {
  toast('正在打包…');
  let code = '';
  try { code = await packCode(); } catch (e) { toast('打包失败：' + (e.message || e)); return; }
  const kb = Math.round(code.length / 1024);
  const shown = code.replace(/(.{6000})/g, '$1\n');
  openSheet('生成同步码',
    `<div class="hint">这台手机的账已打包，约 ${kb} KB（${Math.ceil(code.length / 6000)} 段）。点「复制同步码」，发到另一台手机（微信发给自己、文件传输都行），在那台点「导入同步码」粘进去。码里含账号和密码，只发给你自己的设备。若微信提示文字太长，改用上面的「导出 JSON」发文件。一段都不能少，否则导入会提示不完整。</div>
    <div class="field"><label>同步码</label><textarea id="synccode-txt" readonly style="height:160px;font-size:11px;line-height:1.35">${esc(shown)}</textarea></div>
    <div class="btns"><button class="btn line" type="button" onclick="copyCode()">复制同步码</button></div>`,
    () => { closeSheet(); }, '关闭');
}
function copyCode() {
  const el = $('#synccode-txt'); if (!el) return;
  el.focus(); el.select(); try { el.setSelectionRange(0, el.value.length); } catch (e) {}
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(el.value).then(() => toast('已复制，去发给另一台手机')).catch(() => toast('请长按文本框手动复制')); return; }
  toast(ok ? '已复制，去发给另一台手机' : '请长按文本框手动复制');
}
function openSyncIn() {
  openSheet('导入同步码',
    `<div class="hint">把另一台手机生成的同步码整段粘进来。导入会用这份账覆盖本机数据，导入后需要重新登录。</div>
    <div class="field"><label>同步码</label><textarea id="syncin-txt" placeholder="DX3C1:..." style="height:160px;font-size:11px;line-height:1.35"></textarea></div>`,
    async () => {

    }, '导入并覆盖本机');

const chipsRowInner = (items, active, act) => items.map(i => `<button class="chip ${active === i.key ? 'on' : ''}" data-act="${act}" data-v="${esc(i.key)}">${esc(i.label)}${i.count != null ? `<span class="cnt">${i.count}</span>` : ''}</button>`).join('');

/* 按数据实际出现的值生成分类（保留原有顺序，其余按数量追加，不漏任何一类） */
const catChipsFor = (rows, field, preferred, allLabel) => {
  const cnt = new Map();
  rows.forEach(x => { const v = x && x[field] != null ? String(x[field]).trim() : ''; if (v) cnt.set(v, (cnt.get(v) || 0) + 1); });
  const rest = Array.from(cnt.keys()).filter(v => !preferred.includes(v)).sort((a, b) => cnt.get(b) - cnt.get(a));
  const items = preferred.filter(v => cnt.has(v)).concat(rest).map(v => ({ key: v, label: v, count: cnt.get(v) }));
  return allLabel === null ? items : [{ key: '', label: allLabel || '全部', count: rows.length }].concat(items);
};

function supplierSummary() {
  const outThisMonth = id => DB.pawnOuts.filter(o => o.pawn_id === id && (o.date || '').slice(0, 7) === ymNow()).reduce((a, o) => a + num(o.qty), 0);

  DB.pawns.forEach(p => {
    const k = p.supplier || '未填供应商';
    const g = map[k] = map[k] || { supplier: k, pawns: [], debt: 0 };
    g.pawns.push(p);
  });
  Object.values(map).forEach(g => {
    const active = g.pawns.filter(p => p.status === '在押');
    g.inStockCount = active.reduce((a, p) => a + num(p.stock_qty), 0);
    g.inStockValue = active.reduce((a, p) => a + num(p.stock_qty) * num(p.purchase_price), 0);
    g.monthOutCount = g.pawns.reduce((a, p) => a + outThisMonth(p.id), 0);
    g.monthOutCost = g.pawns.reduce((a, p) => a + outThisMonth(p.id) * num(p.purchase_price), 0);
    g.debt = g.pawns.filter(p => !p.settled_date).reduce((a, p) => a + num(p.outQty) * num(p.purchase_price), 0);
  });
  return Object.values(map).sort((a, b) => b.debt - a.debt);

const relDay = k => {
  if (!k) return '未设日期';
  const d = Math.floor((new Date(k) - new Date(today())) / 86400000);
  return d === 0 ? '今天' : d === 1 ? '明天' : d === -1 ? '昨天' : d === -2 ? '前天' : d > 0 ? d + ' 天后' : (-d) + ' 天前';
};
function pSchedule() {
  const me = '曾凡麟';
  const seg = ui.seg === 0 ? 'mine' : 'assigned';
  let list = DB.tasks.filter(t => seg === 'mine' ? t.assignee === me : t.owner === me);

const QUICK = ['我今天几单', '这个月赚多少', '还剩多少待修', '押货欠多少', '保本了吗', '备件缺什么'];
function pChat() {
  if (!ui.chat.length) ui.chat = [{ me: false, text: '我在。店里的账、库存、押货、备件、任务都能问，只答本地台账里的数。\n例：这个月赚多少 / 押货欠多少 / 还有几台待修。' }];
  return bhead('问青龙', '', `<div class="bsub">问店里的数据，比如：这个月赚多少</div>`) + `<div id="chatbox">
  <div class="chips" style="margin-bottom:14px">${QUICK.map(q => `<button class="chip" data-act="quick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  ${ui.chat.map(m => `<div class="msg ${m.me ? 'me' : 'ai'}">${esc(m.text)}</div>`).join('')}</div>`;
}
function answer(q) {
  const ym = ymNow(), st = mStats(ym), sk = stockSum(), fx = fixedTotal(), fs = flowStats(ym);
  const rep = DB.orders.filter(o => o.repair_status === '待修');
  if (/今天|今日/.test(q)) { const t = DB.orders.filter(o => o.order_date === today()); return `今天 ${t.length} 单，收款 ${money(t.reduce((a, o) => a + num(o.income), 0))}，毛利 ${money(t.reduce((a, o) => a + oProfit(o), 0))}。`; }
  if (/赚|毛利|利润|营业额|收入/.test(q)) return `本月（${ym}）${st.n} 单，收款 ${money(st.income)}，成本 ${money(st.cost)}，毛利 ${money(st.profit)}${st.income ? '，毛利率 ' + (st.profit / st.income * 100).toFixed(1) + '%' : ''}。`;
  if (/保本/.test(q)) { const gap = breakEven() - st.income; const q_cash = cashRunway(); if (st.profit <= 0) return `本月毛利为负（${money(st.profit)}），固定开支 ${money(fx)}，先清高成本单。`; if (gap > 0) { const per = st.profit / Math.max(1, st.n); return `还没到保本：固定开支 ${money(fx)}，本月毛利 ${money(st.profit)}，差 ${money(gap)}。按单均毛利 ${money(per)}，还要约 ${Math.ceil(gap / per)} 单。`; } return `已过保本线：毛利 ${money(st.profit)} 覆盖固定开支 ${money(fx)}，超 ${money(-gap)}。`; }
  if (/待修|修好|维修/.test(q)) return `维修单待修 ${rep.length} 单${rep.length ? '，最久 ' + Math.max.apply(null, rep.map(o => daysFrom(o.order_date))) + ' 天' : ''}；回收待修 ${repairDev().length} 台。`;
  if (/押货|欠|供应商/.test(q)) return `欠供应商合计 ${money(debtTotal())}，在押 ${activePawns().reduce((a, p) => a + num(p.stock_qty), 0)} 件，在押货值 ${money(activePawns().reduce((a, p) => a + num(p.stock_qty) * num(p.purchase_price), 0))}。`;
  if (/库存|压|货值|资金/.test(q)) return `在库 ${sk.count} 台，回收成本 ${money(sk.buy)}，挂牌 ${money(sk.listed)}，待修成本 ${money(sk.rep)}，备件 ${money(sk.parts)}，合计 ${money(sk.total)}。`;
  if (/缺|预警|备件/.test(q)) { const l = lowParts(); return l.length ? `缺货 ${l.length} 项：${l.map(p => p.name + '（剩' + num(p.stock_qty) + '/' + num(p.safe_stock) + '）').join('、')}` : '备件库存都高于安全库存，没有缺货。'; }
  if (/流水|现金|账上/.test(q)) return `本月流水收入 ${money(fs.inc)}，支出 ${money(fs.out)}，净额 ${money(fs.net)}。`;
  if (/客户/.test(q)) { const c = customers(); return `客户 ${c.length} 位，客单最高：${c[0] ? c[0].name + ' ' + money(c[0].total) : '—'}。`; }
  if (/工程师|业绩/.test(q)) { const rows = DB.engineers.map(e => { const l = st.l.filter(o => o.engineer_name === e.name); return { n: e.name, c: l.length, v: l.reduce((a, o) => a + num(o.income), 0) }; }).filter(x => x.c); return rows.map(r => `${r.n}：${r.c} 单 ${money(r.v)}`).join('；') || '本月还没有工单。'; }
  return '我只答本地台账里的数，可以问：今天几单 / 这个月赚多少 / 保本了吗 / 押货欠多少 / 待修多少 / 备件缺什么。';
}

/* ================= 排序 ================= */
function applySortList(l) {
  const r = route, s = ui.sortBy;
  if (r === '/customers') {
    if (s === 'count_desc') return l.slice().sort((a, b) => b.count - a.count);
    if (s === 'last_desc') return l.slice().sort((a, b) => (b.last || '').localeCompare(a.last || ''));
    return l.slice().sort((a, b) => b.total - a.total);
  }
  const by = (k, dir) => l.slice().sort((a, b) => (num(a[k]) - num(b[k])) * dir);
  if (r === '/device') {
    if (s === 'buy_asc') return by('buy_price', 1);
    if (s === 'buy_desc') return by('buy_price', -1);
    if (s === 'listed_desc') return by('listed_price', -1);
    if (s === 'profit_desc') return l.slice().sort((a, b) => (num(b.listed_price) - num(b.buy_price)) - (num(a.listed_price) - num(a.buy_price)));
    return l.slice().sort((a, b) => (b.recycle_date || '').localeCompare(a.recycle_date || ''));
  }
  if (r === '/part') {
    if (s === 'stock_asc') return by('stock_qty', 1);
    if (s === 'stock_desc') return by('stock_qty', -1);
    if (s === 'buy_asc') return by('buy_price', 1);
    if (s === 'buy_desc') return by('buy_price', -1);
    return l.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  }
  if (r === '/pawn') {
    if (s === 'price_asc') return by('purchase_price', 1);
    if (s === 'price_desc') return by('purchase_price', -1);
    if (s === 'stock_desc') return by('stock_qty', -1);
    return l.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  }
  if (s === 'date_asc') return l.slice().sort((a, b) => (a.order_date || '').localeCompare(b.order_date || ''));
  if (s === 'income_desc') return by('income', -1);
  if (s === 'profit_desc') return l.slice().sort((a, b) => oProfit(b) - oProfit(a));
  return l.slice().sort((a, b) => (b.order_date || '').localeCompare(a.order_date || ''));
}

function cm() {
  const d = { rent: 5600, utility: 300, labor: 3000, yearly: 17400, margin: 0.522, mtRate: 0.05, dyRate: 0.115, mtShare: 0.58, dyShare: 0.42, cashStart: 0, cashStartDate: '' };
  DB.costModel = Object.assign({}, d, DB.costModel || {});
  if (!DB.costModel.cashStartDate) DB.costModel.cashStartDate = ymNow() + '-01';
  return DB.costModel;
}
function breakEven() { const c = cm(); return num(c.margin) > 0 ? fixedTotal() / num(c.margin) : 0; }
function blendedComm() { const c = cm(); return num(c.mtRate) * num(c.mtShare) + num(c.dyRate) * num(c.dyShare); }
const settleOf = income => num(income) * (1 - blendedComm());
const settleProfitOf = o => settleOf(o.income) - oCost(o);

/* ---- 设备在库天数 / 滞销 ---- */
const devInDate = d => d.recycle_date || (d.created_at || '').slice(0, 10);
function devDays(d) { const s = devInDate(d); if (!s) return null; return Math.floor((new Date(today()) - new Date(s)) / 86400000); }
function slowDevices() {
  return DB.devices.filter(d => d.status !== '已售出' && d.status !== '报废')
    .filter(d => { const n = devDays(d); return n != null && n >= 45; })
    .sort((a, b) => devDays(b) - devDays(a));
}

/* ---- 现金流周预警 ---- */
function weekBuckets() {
  const c = cm();
  const start = c.cashStartDate || (ymNow() + '-01');
  const t = today();
  let begin = new Date(start), cash = num(c.cashStart), out = [], i = 1;
  if (begin > new Date(t)) return out;
  while (begin <= new Date(t) && i <= 16) {
    const end = new Date(begin.getTime() + 6 * 86400000);
    const from = begin.toISOString().slice(0, 10), to = end.toISOString().slice(0, 10);
    const l = DB.flows.filter(f => (f.date || '') >= from && (f.date || '') <= to);
    const inc = l.filter(f => f.type === '收入').reduce((a, f) => a + num(f.amount), 0);
    const exp = l.filter(f => f.type === '支出').reduce((a, f) => a + num(f.amount), 0);
    const close = cash + inc - exp;
    out.push({ i, from, to, begin: cash, inc, exp, close });
    cash = close; begin = new Date(begin.getTime() + 7 * 86400000); i++;
  }
  return out;
}
function cashRunway() {
  const w = weekBuckets();
  if (!w.length) return { weeks: 0, cash: num(cm().cashStart), perWeek: fixedTotal() / 4.33, level: 'red' };
  const cash = w[w.length - 1].close, perWeek = fixedTotal() / 4.33;
  const weeks = perWeek > 0 ? Math.max(0, cash / perWeek) : 0;
  const level = cash < 0 || weeks < 4 ? 'red' : weeks < 8 ? 'amber' : 'green';
  return { weeks, cash, perWeek, level, neg: cash < 0, gap: cash < 0 ? -cash : 0 };
}
function pCash() {
  const w = weekBuckets(), r = cashRunway(), c = cm();
  const lv = r.neg ? { t: '紧急 · 现金已透支', c: C.danger, bg: C.dangerBg } : r.level === 'red' ? { t: '紧急 · 少于 4 周', c: C.danger, bg: C.dangerBg } : r.level === 'amber' ? { t: '关注 · 4~8 周', c: C.warning, bg: C.warningBg } : { t: '安全 · 超过 8 周', c: C.success, bg: C.successBg };
  return bhead('现金流周预警', '<button class="pill" data-form="cash"><i class="fa-solid fa-pen"></i>期初现金</button>') + `<div class="pad" style="padding-top:14px">

    <div style="font-size:34px;font-weight:900;color:${lv.c};letter-spacing:-1px;margin:8px 0 2px">${r.neg ? '已透支' : r.weeks.toFixed(1) + ' 周'}</div>
    <div class="hint">当前现金 ${money(r.cash)}${r.neg ? '（缺口 ' + money(r.gap) + '）' : ''} ÷ 周均固定支出 ${money(r.perWeek)}（月固定 ${money(fixedTotal())} ÷ 4.33）</div>
    ${r.neg ? '<div class="hint" style="color:var(--danger);font-weight:700;margin-top:6px">现金为负，可撑周数按 0 计：先补 ' + money(r.gap) + ' 让账面回正，或把固定开支压下来，再看这张表。</div>' : ''}
    <div class="divider"></div>
    <div class="kpis">${KPI('期初现金', money(c.cashStart))}${KPI('当前现金', money(r.cash), r.neg ? C.danger : C.text)}${KPI('起算日', esc(c.cashStartDate || '—'))}</div>
    ${num(c.cashStart) ? '' : '<div class="hint" style="color:var(--warning);font-weight:700;margin-top:8px">期初现金还没填，可撑周数不准 —— 点右上角填你起算日手上/账上的现金。</div>'}
  </div>
  ${w.length ? `<div class="card" style="margin-top:14px"><div class="sec-title" style="margin-bottom:10px">逐周明细</div>

function engWage(e, st) {
  const l = st.l.filter(o => o.engineer_name === e.name);
  const base = num(e.base_salary), rate = num(e.commission_rate), att = num(e.attendance);
  const settleProfit = l.reduce((a, o) => a + settleProfitOf(o), 0);
  const comm = Math.max(0, settleProfit) * rate;
  const pay = base + comm;
  const perDay = att > 0 ? l.reduce((a, o) => a + num(o.income), 0) / att : 0;
  return { n: l.length, settleProfit, comm, pay, perDay, att };
}

function delOrder(id) {

  if (o && !isOwner() && (o.engineer_name || '') !== (SESSION ? SESSION.name : '')) { toast('只能删除自己的工单'); return; }
  if (!confirm('确定删除这张工单？删除后不可恢复。')) return; DB.orders = DB.orders.filter(o => o.id !== id); log('删除工单'); persist(); toast('已删除'); render(); }
function delDevice(id) { if (!confirm('确定删除这台设备？删除后不可恢复。')) return; DB.devices = DB.devices.filter(d => d.id !== id); log('删除设备'); persist(); render(); toast('已删除'); }
function delPart(id) { if (!confirm('确定删除备件？库存记录一并清除，不可恢复。')) return; DB.parts = DB.parts.filter(p => p.id !== id); log('删除备件'); persist(); render(); }
function delPawn(id) { if (!confirm('确定删除这条押货记录？')) return; DB.pawns = DB.pawns.filter(p => p.id !== id); log('删除押货'); persist(); render(); }
function delFlow(id) { DB.flows = DB.flows.filter(f => f.id !== id); log('删除流水'); persist(); render(); }
function delQuote(id) { DB.quotes = DB.quotes.filter(q => q.id !== id); log('删除报价'); persist(); render(); }
function toggleTask(id) { const t = DB.tasks.find(x => x.id === id); if (!t) return; t.status = t.status === 'done' ? 'pending' : 'done'; log('任务' + (t.status === 'done' ? '完成' : '撤销完成') + ' ' + t.title); persist(); render(); }

function sellDevice(id) {

}

    try {

      ['devices', 'orders', 'parts', 'pawns', 'pawnOuts', 'tasks', 'flows', 'quotes', 'engineers', 'expenses', 'logs', 'aftersales', 'platform', 'priceList', 'suppliers', 'competitors', 'sopChecks'].forEach(k => { if (Array.isArray(d[k])) DB[k] = d[k]; });

    document.body.appendChild(box);
  }catch(x){}
}
window.addEventListener('error', function(ev){ if(!document.querySelector('#tabbar') && !document.querySelector('.hero')) return; });
try{ ensureDB(); ghLoad(); bootAuth(); render(); }catch(e){ showFatal(e); }

</script>
